- name: Set a hostname for all hosts
  ansible.builtin.hostname:
    name: "{{ inventory_hostname | regex_replace('_','-') }}"
  register: hostname_result

- name: Verifying hostname for all hosts
  ansible.builtin.debug:
    msg: "{{ hostname_result }}"

- name: Inserting hosts names and IP to hosts file
  ansible.builtin.lineinfile:
    dest: /etc/hosts
    line: "{{ hostvars[item]['ansible_hostname'] | regex_replace('_','-') }} {{ hostvars[item]['ansible_default_ipv4']['address'] }} {{ hostvars[item]['inventory_hostname'] | regex_replace('_','-') }}"
    state: present
  with_items: "{{ play_hosts }}"

- name: Update and upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: yes
    cache_valid_time: 3600
  timeout: 600

- name: Install python3-pip and python3-venv packages
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
    state: present

- name: Installing Java for Jenkins agent
  ansible.builtin.apt:
    name: openjdk-{{ openjdk_version }}-jdk

- name: Install net-tools
  ansible.builtin.apt:
    name: net-tools

- name: Disable swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: true

# --- Kernel modules ---

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Ensure kernel modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

# --- Sysctl ---

- name: Configure sysctl for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/kubernetes.conf
    reload: yes
  loop:
    - { key: net.bridge.bridge-nf-call-ip6tables, value: '1' }
    - { key: net.bridge.bridge-nf-call-iptables, value: '1' }
    - { key: net.ipv4.ip_forward, value: '1' }

# --- Timezone ---

- name: Set timezone
  community.general.timezone:
    name: Asia/Jerusalem

# --- Containerd ---

- name: Download containerd
  ansible.builtin.get_url:
    url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_latest_version }}/containerd-{{ containerd_latest_version }}-linux-amd64.tar.gz"
    dest: /tmp
    mode: "0775"

- name: Extract containerd
  ansible.builtin.unarchive:
    src: /tmp/containerd-{{ containerd_latest_version }}-linux-amd64.tar.gz
    dest: /usr/local
    remote_src: yes

- name: Create containerd service directory
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system/
    state: directory
    mode: "0755"

- name: Install containerd systemd service
  ansible.builtin.blockinfile:
    path: /usr/local/lib/systemd/system/containerd.service
    create: true
    block: |
      [Unit]
      Description=containerd container runtime
      Documentation=https://containerd.io
      After=network.target local-fs.target

      [Service]
      ExecStartPre=-/sbin/modprobe overlay
      ExecStart=/usr/local/bin/containerd
      Type=notify
      Delegate=yes
      KillMode=process
      Restart=always
      RestartSec=5
      LimitNPROC=infinity
      LimitCORE=infinity
      LimitNOFILE=infinity
      TasksMax=infinity
      OOMScoreAdjust=-999

      [Install]
      WantedBy=multi-user.target

- name: Configure crictl
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///var/run/containerd/containerd.sock
      image-endpoint: unix:///var/run/containerd/containerd.sock
      timeout: 10
      debug: true
    mode: "0644"

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd/
    state: directory
    mode: "0755"

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml.generated

- name: Enable systemd cgroup in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start containerd
  ansible.builtin.service:
    name: containerd
    enabled: yes
    state: restarted

# --- Runc ---

- name: Download runc
  ansible.builtin.get_url:
    url: "https://github.com/opencontainers/runc/releases/download/{{ runc_latest_version }}/runc.amd64"
    dest: /tmp/runc.amd64
    mode: "0755"

- name: Install runc
  ansible.builtin.copy:
    src: /tmp/runc.amd64
    dest: /usr/local/sbin/runc
    mode: "0755"
    remote_src: yes

# --- CNI plugins ---

- name: Download CNI plugins
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugin_version }}/cni-plugins-linux-amd64-{{ cni_plugin_version }}.tgz"
    dest: /tmp
    mode: "0775"

- name: Create CNI directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: "/tmp/cni-plugins-linux-amd64-{{ cni_plugin_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: yes

# --- Kubernetes packages ---

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - nfs-common
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes apt key
  ansible.builtin.shell: >
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key
    | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
