- name: Initialize the Kubernetes cluster using kubeadm
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr=10.244.0.0/16
    --cri-socket {{ container_runtime }}
  register: init_output
  tags: [init]

- debug:
    var: init_output.stdout_lines
  tags: [init]

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  tags: [init]

- name: Store join command as fact
  ansible.builtin.set_fact:
    kubeadm_join_cmd: "{{ join_command.stdout }}"
  tags: [init]

- name: Creating .kube directory
  ansible.builtin.shell: mkdir -p /home/"{{hostvars['master_node01']['ansible_ssh_user']}}"/.kube
  become_user: "{{hostvars['master_node01']['ansible_ssh_user']}}"
  tags: [init]

- name: Copy kubeconfig with owner and permissions
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{hostvars['master_node01']['ansible_ssh_user']}}/.kube/config
    owner: "{{hostvars['master_node01']['ansible_ssh_user']}}"
    group: "{{hostvars['master_node01']['ansible_ssh_user']}}"
    mode: "0600"
    remote_src: yes
  become: true
  tags: [init]

- name: Installing Helm
  ansible.builtin.shell: |
    curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    chmod 700 get_helm.sh
    ./get_helm.sh
  become: true
  tags: [helm]

- name: Label worker nodes
  command: >
    kubectl label node {{ item }} nodepool=workers --overwrite
  loop: "{{ groups['k8s_nodes'] }}"
  run_once: true
  tags: [cni]

- name: Add Cilium chart repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: "https://helm.cilium.io"
    state: present
  tags: [cni]

- name: Deploy Cilium CNI
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    state: present
    values:
      kubeProxyReplacement: true
      k8sServiceHost: "{{ hostvars['master_node01']['ansible_host'] }}"
      k8sServicePort: 6443
  tags: [cni]
